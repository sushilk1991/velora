name: Pull request checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install uv when absent
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            brew install uv
          fi
      - name: Run project tests
        run: make test

  distribution-build:
    # The DMG compiles Sources/Velora/Selftest out (VELORA_DISTRIBUTION; see
    # scripts/make-app.sh). Build that configuration here so production code
    # that reaches into the harness fails on the PR, not in make-dmg.sh.
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Build the release configuration without the self-test harness
        run: swift build -c release -Xswiftc -DVELORA_DISTRIBUTION
      - name: Check the stripped executable the way verify-dmg.sh does
        shell: zsh {0}
        run: |
          set -euo pipefail
          cp .build/release/Velora "$RUNNER_TEMP/Velora"
          strip -x "$RUNNER_TEMP/Velora"
          source scripts/signing-config.sh
          validate_distribution_executable "$RUNNER_TEMP/Velora"
