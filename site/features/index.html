<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0; url=../#features">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161311" media="(prefers-color-scheme: dark)">
  <title>Features — Velora</title>
  <link rel="canonical" href="https://sushilk1991.github.io/velora/">
  <link rel="icon" href="../assets/velora-mark.svg" type="image/svg+xml">
  <script>
    document.documentElement.classList.add("js");
    try {
      var stored = localStorage.getItem("velora-theme");
      if (stored === "dark" || stored === "light") {
        document.documentElement.dataset.theme = stored;
      }
    } catch (error) {
      /* Private browsing can refuse storage; the media query still applies. */
    }
  </script>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main id="main">
    <section class="page-hero" id="top">
      <div class="page-hero-inner">
        <p class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span> Features</p>
        <h1>Every feature has its own page.</h1>
        <p class="hero-lede">The feature index lives on the home page. <a href="../#features">Open the feature list</a> if you are not taken there.</p>
      </div>
    </section>
  </main>
</body>
</html>
